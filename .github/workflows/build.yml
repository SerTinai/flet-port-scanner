name: Flet APK Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Flet'in ısrarla istediği 3.41.7 sürümünü tam olarak buraya tanımlıyoruz! 🎯
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Build APK
        run: |
          # Flet'in kurulu Flutter'ı tanıması için çevresel yolu (PATH) fırlatıyoruz 💣
          export PATH="$FLUTTER_ROOT/bin:$PATH"
          flet build apk
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flet-port-scanner-apk
          path: build/apk/*.apk
