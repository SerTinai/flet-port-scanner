name: Flet APK Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Soru sorma krizini çözmek için Flutter'ı önceden kendimiz kuruyoruz! 🚀
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0' # Flet'in kararlı çalıştığı sürüm
          channel: 'stable'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Build APK
        run: |
          # Önceden kurulu Flutter'ı kullanması için --no-interactive ekliyoruz
          flet build apk --no-interactive
